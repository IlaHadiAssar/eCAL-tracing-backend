repos:
  # -------- Built-in pre-commit hooks for basic hygiene --------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  # -------- clang-format (C/C++ formatter) --------
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.1  # adjust to installed version
    hooks:
      - id: clang-format
        files: \.(c|cpp|cc|cxx|h|hpp)$

  # -------- clang-tidy (static analysis) --------
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        language: system
        types: [c, c++]
        files: \.(c|cpp|cc|cxx|h|hpp)$
        pass_filenames: true
        args:
          - "--quiet"
          - "--config-file=.clang-tidy"
